name: Ubot Flutter Build

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL release asset project.zip"
        required: true
        type: string
      tag:
        description: "Tag release tempat project.zip diunggah"
        required: true
        type: string
      build_type:
        description: "debug atau release"
        required: true
        default: release
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
    steps:
      - name: Unduh project
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/src" && cd "$RUNNER_TEMP/src"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "project.zip"
          unzip -q project.zip -d proj
          rm -f project.zip
          PUB="$(find proj -maxdepth 4 -name pubspec.yaml -not -path '*/.*' | head -n1)"
          if [ -z "$PUB" ]; then echo "::error::pubspec.yaml tidak ditemukan di ZIP"; exit 1; fi
          DIR="$RUNNER_TEMP/src/$(dirname "$PUB")"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Deteksi versi Flutter
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          FV=""
          # 1) .fvmrc / fvm_config.json
          if [ -f .fvmrc ]; then FV="$(grep -oE '"flutter"[[:space:]]*:[[:space:]]*"[^"]+"' .fvmrc | sed -E 's/.*"([^"]+)"$/\1/' || true)"; fi
          if [ -z "$FV" ] && [ -f .fvm/fvm_config.json ]; then FV="$(grep -oE '"flutterSdkVersion"[[:space:]]*:[[:space:]]*"[^"]+"' .fvm/fvm_config.json | sed -E 's/.*"([^"]+)"$/\1/' || true)"; fi
          # 2) batas atas Dart SDK di pubspec: "<3.0.0" berarti project Dart 2 -> pakai Flutter 3.7.12
          if [ -z "$FV" ]; then
            UPPER="$(grep -m1 -E '^[[:space:]]+sdk:[[:space:]]*["'"'"']?[^f]' pubspec.yaml | grep -oE '<[[:space:]]*[0-9]+\.[0-9]+' | head -n1 | tr -d '< ' || true)"
            if [ "$UPPER" = "3.0" ] || [ "$UPPER" = "2.99" ]; then FV="3.7.12"; fi
          fi
          if [ -n "$FV" ] && [[ "$FV" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "FLUTTER_VERSION=$FV" >> "$GITHUB_ENV"; echo "Flutter $FV (dari project)"
          else
            echo "FLUTTER_VERSION=" >> "$GITHUB_ENV"; echo "Flutter stable (terbaru)"
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Siapkan platform Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name "$(grep -m1 '^name:' pubspec.yaml | awk '{print $2}')" .
          fi
          # beri Gradle memori cukup
          touch android/gradle.properties
          grep -q '^org.gradle.jvmargs' android/gradle.properties || echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' >> android/gradle.properties
          grep -q '^android.useAndroidX' android/gradle.properties || echo 'android.useAndroidX=true' >> android/gradle.properties
          grep -q '^android.enableJetifier' android/gradle.properties || echo 'android.enableJetifier=true' >> android/gradle.properties
          yes | flutter doctor --android-licenses >/dev/null 2>&1 || true

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get || (sleep 5 && flutter pub get)

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set +e
          flutter build apk --"$BUILD_TYPE" --no-tree-shake-icons
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "::warning::Build pertama gagal (kode $RC), mencoba ulang setelah flutter clean"
            flutter clean && flutter pub get && flutter build apk --"$BUILD_TYPE" --no-tree-shake-icons
            RC=$?
          fi
          exit $RC

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.build_type }}
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 3
